# HTTP - Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name {MY_DOMAIN};
    server_tokens off;
    client_max_body_size 10m;
    limit_req zone=proxy_rate_limit burst=30 nodelay;
    limit_conn conn_limit_per_ip 20;

    # Required for Certbot webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - The actual proxy
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name {MY_DOMAIN};
    server_tokens off;
    client_max_body_size 10m;
    limit_req zone=proxy_rate_limit burst=30 nodelay;
    limit_conn conn_limit_per_ip 20;

    # SSL certificates (will be created by Certbot)
    ssl_certificate /etc/letsencrypt/live/{MY_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{MY_DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers (optional but recommended)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # WordPress and its plugins commonly use inline scripts/styles and data-URI
    # fonts. Google Fonts also requires both googleapis.com and gstatic.com.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https:; worker-src 'self' blob:; frame-src 'self' https:; frame-ancestors 'self'" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Proxy to your Docker container
    location / {
        proxy_pass http://{CONTAINER_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
        proxy_hide_header X-Powered-By;
        proxy_buffering on;
        proxy_request_buffering on;

        # Optional: Timeouts and buffering
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}