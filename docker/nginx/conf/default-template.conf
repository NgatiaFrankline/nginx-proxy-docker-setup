server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    default_type text/html;
    return 200 '<!doctype html><html><head><title>Nginx proxy</title></head><body><h1>Nginx proxy is running</h1><p>No service is configured for this address.</p></body></html>';
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate /tmp/nginx-default.crt;
    ssl_certificate_key /tmp/nginx-default.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    default_type text/html;
    return 200 '<!doctype html><html><head><title>Nginx proxy</title></head><body><h1>Nginx proxy is running</h1><p>No service is configured for this address.</p></body></html>';
}
